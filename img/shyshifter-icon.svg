<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Shyshifter">
  <defs>
    <linearGradient id="ssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14706f"/>
      <stop offset="100%" stop-color="#082f3b"/>
    </linearGradient>
    <linearGradient id="ssFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <clipPath id="ssTile"><rect width="100" height="100" rx="24"/></clipPath>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#ssBg)"/>
  <!-- soft glow behind the fox -->
  <g clip-path="url(#ssTile)"><circle cx="60" cy="52" r="34" fill="#a3e635" opacity=".14"/></g>
  <!-- fox, shifted right so the left side can dissolve -->
  <g transform="translate(8 2)">
    <polygon points="30,18 46,38 27,47" fill="#f59e0b"/>
    <polygon points="72,18 56,38 75,47" fill="#f59e0b"/>
    <polygon points="33,25 43,38 32,43" fill="#082f3b" opacity=".35"/>
    <polygon points="69,25 59,38 70,43" fill="#082f3b" opacity=".35"/>
    <polygon points="27,47 46,38 56,38 75,47 63,72 51,82 39,72" fill="url(#ssFace)"/>
    <polygon points="39,72 51,82 63,72 51,57" fill="#fff7e6"/>
    <polygon points="38,52 47,55 43,60" fill="#082f3b"/>
    <polygon points="64,52 55,55 59,60" fill="#082f3b"/>
    <polygon points="47,70 55,70 51,75" fill="#082f3b"/>
  </g>
  <!-- the shift: left edge dissolves into pixels -->
  <g>
    <rect x="22" y="44" width="6" height="6" rx="1.2" fill="#84cc16"/>
    <rect x="13" y="52" width="5" height="5" rx="1" fill="#f59e0b"/>
    <rect x="21" y="60" width="4" height="4" rx="1" fill="#d9f99d" opacity=".9"/>
    <rect x="9" y="40" width="4" height="4" rx="1" fill="#d9f99d" opacity=".6"/>
    <rect x="15" y="66" width="3" height="3" rx=".8" fill="#84cc16" opacity=".7"/>
    <rect x="7" y="58" width="3" height="3" rx=".8" fill="#f59e0b" opacity=".6"/>
    <rect x="16" y="33" width="3" height="3" rx=".8" fill="#f59e0b" opacity=".5"/>
  </g>
</svg>
